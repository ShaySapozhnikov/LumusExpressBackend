<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumus Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 p-6">
    <div class="max-w-md mx-auto mt-16 bg-white rounded-xl shadow p-6">
        <h1 class="text-2xl font-semibold mb-6">Lumus Admin</h1>

        <form id="login-form" method="post" action="/admin/adminlogin" class="space-y-4">

            <label for="username" class="block text-sm font-medium">Username</label>

            <input type="text" id="username" name="username" autocomplete="username" required
            class="block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-900 focus:outline-none">


            <label for="password" class="block text-sm font-medium">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required
            class="block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-900 focus:outline-none">



            <button type="submit" class="w-full rounded-md bg-slate-900 px-4 py-2 text-white hover:bg-slate-700">Log in</button>

            


        </form>

        <p id="status" class="mt-4 text-sm text-red-600">{{status}}</p>
    </div>
</body>
</html>
